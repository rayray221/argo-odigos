instrumentor:
 mountMethod: k8s-init-container

odiglet:
  # extended: true
  # odiglet:
  #   privileged: true
  traceIdSuffix: '6A'
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                  - "kind-control-plane"

