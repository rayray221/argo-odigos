apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: odigos-deployment
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io/foreground
spec:
  project: default
  sources:
    - repoURL: https://odigos-io.github.io/odigos
      chart: odigos
      targetRevision: v1.36.3 # REQUIRED: set the version from 'helm search repo odigos --versions'
      helm:
        releaseName: odigos
        valueFiles: 
          - $values/values/values.yaml
    - repoURL: https://github.com/rayray221/argo-odigos
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: odigos-system
  ignoreDifferences:
    - kind: ConfigMap
      name: odigos-deployment
      jsonPointers:
        - /data/odigos-deployment-id
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true