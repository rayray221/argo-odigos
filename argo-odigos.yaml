apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: odigos-deployment
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://odigos-io.github.io/odigos
      chart: odigos
      targetRevision: v1.36.0 # REQUIRED: set the version from 'helm search repo odigos --versions'
      helm:
        releaseName: odigos
        valueFiles: 
          - values.yaml
    - repoURL: https://github.com/rayray221/argo-odigos
      targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: odigos-system
    path: .
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true