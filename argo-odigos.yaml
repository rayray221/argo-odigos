apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: odigos-deployment
  namespace: argocd  # <- Replace with your Argo CD namespace
spec:
  project: default
  source:
    repoURL: https://odigos-io.github.io/odigos
    chart: odigos
    targetRevision: v1.36.0 # REQUIRED: set the version from 'helm search repo odigos --versions'
    helm:
      releaseName: odigos
      valueFiles: 
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: odigos-system  # <- Replace with the desired namespace where you want Odigos to be installed
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true